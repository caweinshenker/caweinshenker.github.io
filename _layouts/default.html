<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>{% if page.title %}{{ page.title }} | {% endif %}{{ site.title }}</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=JetBrains+Mono&display=swap" rel="stylesheet">
  <style>
    :root {
      --bg: #0a0a0a;
      --surface: #141414;
      --border: #262626;
      --text: #e5e5e5;
      --text-muted: #a3a3a3;
      --accent: #3b82f6;
      --accent-hover: #60a5fa;
      --code-bg: #1a1a1a;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
      background: var(--bg);
      color: var(--text);
      line-height: 1.7;
      font-size: 16px;
      min-height: 100vh;
    }

    .container {
      max-width: 680px;
      margin: 0 auto;
      padding: 4rem 1.5rem;
    }

    header {
      margin-bottom: 3rem;
      padding-bottom: 2rem;
      border-bottom: 1px solid var(--border);
    }

    nav {
      display: flex;
      gap: 1.5rem;
      font-size: 0.9rem;
    }

    nav a {
      color: var(--text-muted);
      text-decoration: none;
      transition: color 0.2s;
    }

    nav a:hover, nav a.active {
      color: var(--text);
    }

    a { color: var(--accent); text-decoration: none; transition: color 0.2s; }
    a:hover { color: var(--accent-hover); }

    h1 {
      font-size: 2.25rem;
      font-weight: 600;
      letter-spacing: -0.02em;
      margin-bottom: 1rem;
      color: #fff;
    }

    h2 {
      font-size: 1.25rem;
      font-weight: 600;
      margin: 2.5rem 0 1rem;
      color: #fff;
    }

    h3 {
      font-size: 1.1rem;
      font-weight: 500;
      margin: 2rem 0 0.75rem;
      color: #fff;
    }

    p { margin: 1rem 0; color: var(--text-muted); }

    .lead { font-size: 1.125rem; color: var(--text); }

    ul, ol { margin: 1rem 0; padding-left: 1.5rem; color: var(--text-muted); }
    li { margin: 0.5rem 0; }
    li::marker { color: var(--border); }

    code {
      font-family: 'JetBrains Mono', monospace;
      font-size: 0.875em;
      background: var(--code-bg);
      padding: 0.2em 0.4em;
      border-radius: 4px;
      border: 1px solid var(--border);
    }

    pre {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 8px;
      padding: 1.25rem;
      overflow-x: auto;
      margin: 1.5rem 0;
    }

    pre code {
      background: none;
      border: none;
      padding: 0;
      font-size: 0.85rem;
      line-height: 1.6;
    }

    .post-meta {
      color: var(--text-muted);
      font-size: 0.875rem;
      margin-bottom: 2rem;
    }

    .post-list {
      list-style: none;
      padding: 0;
    }

    .post-list li {
      padding: 1rem 0;
      border-bottom: 1px solid var(--border);
    }

    .post-list li:last-child { border-bottom: none; }

    .post-list a {
      font-weight: 500;
      color: var(--text);
    }

    .post-list a:hover { color: var(--accent); }

    .post-list .date {
      display: block;
      font-size: 0.875rem;
      color: var(--text-muted);
      margin-top: 0.25rem;
    }

    .back-link {
      display: inline-block;
      margin-top: 3rem;
      padding-top: 2rem;
      border-top: 1px solid var(--border);
      color: var(--text-muted);
      font-size: 0.9rem;
    }

    .back-link:hover { color: var(--text); }

    strong { color: var(--text); font-weight: 500; }

    hr {
      border: none;
      border-top: 1px solid var(--border);
      margin: 2rem 0;
    }

    footer {
      margin-top: 4rem;
      padding-top: 2rem;
      border-top: 1px solid var(--border);
      color: var(--text-muted);
      font-size: 0.875rem;
    }
  </style>
</head>
<body>
  <div class="container">
    <header>
      <nav>
        <a href="/" {% if page.url == "/" %}class="active"{% endif %}>Home</a>
        <a href="/about" {% if page.url == "/about/" %}class="active"{% endif %}>About</a>
        <a href="https://github.com/caweinshenker">GitHub</a>
      </nav>
    </header>

    <main>
      {{ content }}
    </main>

    <footer>
      Colin Weinshenker
    </footer>
  </div>
</body>
</html>
